sonar.organization=jescobar-cmd
sonar.projectKey=Jescobar-cmd_Front-end
sonar.projectName=FirstGig Frontend
sonar.projectVersion=1.0
sonar.sources=src
sonar.exclusions=dist/**,node_modules/**,coverage/**,public/**,*.config.*,vite.config.js
# El frontend aun no tiene suite de tests: se excluye del calculo de
# cobertura para que el quality gate no falle por new-code coverage.
# Cuando se agreguen tests (Vitest), quitar esta linea y generar lcov.
sonar.coverage.exclusions=src/**
sonar.typescript.tsconfigPath=tsconfig.json
