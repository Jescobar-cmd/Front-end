sonar.organization=jescobar-cmd
sonar.projectKey=Jescobar-cmd_Front-end
sonar.projectName=FirstGig Frontend
sonar.projectVersion=1.0
sonar.sources=src
sonar.exclusions=dist/**,node_modules/**,coverage/**,public/**,*.config.*,vite.config.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
# Hooks de comportamiento de UI (focus trap/scroll lock): requieren suite de
# componentes con DOM; se excluyen del calculo de cobertura por ahora.
sonar.coverage.exclusions=src/hooks/useDialogBehavior.ts,src/hooks/useBackdropDismiss.ts
sonar.typescript.tsconfigPath=tsconfig.json
